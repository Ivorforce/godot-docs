name: godotdocs
channels:
  - conda-forge
dependencies:
  - python-freethreading=3.14.2  # or any version you prefer
  - pygments==2.19.2
  - sphinx==8.1.3
  - sphinx_rtd_theme==3.1.0
  - pip  # Ensure pip is installed in the conda environment
  - pip:
      - sphinx-tabs==3.4.7
      - sphinx-copybutton==0.5.2
      - sphinx-notfound-page==1.1.0
      - sphinxext-opengraph==0.13.0
      - sphinxcontrib-video==0.4.2
